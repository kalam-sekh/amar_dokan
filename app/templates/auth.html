{% extends 'base.html' %}{% block content %}<main class="narrow"><h1>{{ 'ঢুকুন' if mode=='login' else 'নতুন হিসাব খুলুন' }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% if mode=='register' %}<label>আপনার নাম<input required name="name" autocomplete="name"></label>{% endif %}<label>ইমেইল<input required type="email" name="email" autocomplete="email"></label><label>পাসওয়ার্ড<input required minlength="8" type="password" name="password" autocomplete="current-password"></label><button>{{ 'ঢুকুন' if mode=='login' else 'হিসাব খুলুন' }}</button></form>{% if mode=='login' %}<p>নতুন? <a href="/register">হিসাব খুলুন</a></p>{% endif %}</main>{% endblock %}
