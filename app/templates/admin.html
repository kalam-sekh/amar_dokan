{% extends 'base.html' %}{% block content %}<main><h1>দোকান দেখভাল</h1><h2>পণ্য ও মজুত</h2><div class="admin-grid">{% for p in products %}<form class="admin-product" method="post" action="/admin/product/{{p.id}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><b>{{p.name_bn}}</b><label>দাম (প্রতি {{p.base_unit}})<input name="price" value="{{p.price_per_base}}" inputmode="decimal"></label><label>মজুত<input name="stock" value="{{p.stock_base}}" inputmode="decimal"></label><label><input type="checkbox" name="active" {% if p.active %}checked{% endif %}> বিক্রি চলছে</label><button>সেভ করুন</button></form>{% endfor %}</div><h2>সাম্প্রতিক অর্ডার</h2>{% for o in orders %}<p>#{{o.id}} {{o.user.name}} — {{o.total|taka}} ({{o.status}})</p>{% endfor %}</main>{% endblock %}
