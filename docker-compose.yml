services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amar_dokan
      POSTGRES_USER: amar_dokan
      POSTGRES_PASSWORD: amar_dokan
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amar_dokan -d amar_dokan"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports: ["5000:5000"]
    environment:
      - DATABASE_URL=postgresql+psycopg://amar_dokan:amar_dokan@db/amar_dokan
      - SECRET_KEY=local-dev-secret
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
